# This repository's additions to the shared gitleaks configuration
# (decision 0007). scripts/check-public.sh writes a configuration that
# extends the shared one ([extend] path) and appends this file, so the
# shared rules stay unchanged and strict. Each entry is one exact value
# AWS writes in its documentation, with where.

[allowlist]
description = "AWS documentation placeholders (decision 0007)"
regexTarget = "match"
regexes = [
  # rule ec2-resource-id: AWS's placeholder instance id, models/ec2
  # ApplicationStatusCheckAssociationObject docs ("for example,
  # i-0123456789abcdef0")
  '''^i-0123456789abcdef0$''',
  # rule generic-api-key: AWS's placeholder KMS key id, models/comprehend
  # (VolumeKmsKeyId, ModelKmsKeyId, OutputDataConfig$KmsKeyId docs) and
  # the KMS docs throughout
  '''^Key ID: "1234abcd-12ab-34cd-56ef-1234567890ab"$''',
  # the same placeholder without quotes: models/kms, sagemaker,
  # devops-guru, timestream-write KMS key docs
  '''^Key ID: 1234abcd-12ab-34cd-56ef-1234567890ab ?$''',
  '''^key\. KMS Key ID: "1234abcd-12ab-34cd-56ef-1234567890ab"$''',
  # AWS's placeholder multi-Region key id, models/kms
  '''^Key ID: mrk-1234abcd12ab34cd56ef1234567890ab $''',
  # models/wafv2: the example keys of a JSON body match pattern
  '''^KeyToExclude1", "KeyToExclude2"$''',
  # models/storage-gateway: the example S3 access point alias
  '''^Access point alias: test-ap-ab123cdef4gehijklmn5opqrstuvuse1a-s3alias$''',
  # rule ec2-resource-id: example security group and image ids in
  # models/fms (policy document examples), models/comprehend (VpcConfig
  # docs) and models/inspector2 (an example AMI)
  '''^sg-000e55995d61a06bd$''',
  '''^sg-049b2393a25468971$''',
  '''^sg-03b1f67d69ed00197$''',
  '''^sg-03b388029b0a285ea$''',
  '''^ami-0abcdef1234567890$''',
  # rule linkedin-client-id: an enum value, not a credential:
  # models/bedrock-agentcore-control CredentialProviderVendorType
  # LinkedinOauth2, generated as `LinkedinOauth2 = "LinkedinOauth2"`
  '''^LinkedinOauth2 = "LinkedinOauth2"$''',
]
