# Weekly model update (decision 0008): moves the api-models-aws pin to its
# newest commit, regenerates every client, and runs every check with the
# newest public Xo release. Green: the update is merged and the changed
# modules are tagged. Red: the update's pull request stays open and an
# issue links the run. No AWS credentials and no calls to AWS.
name: models

on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only: no pull request, merge, tag or issue"
        type: boolean
        default: true
      update_models:
        description: "Move the model pin to the newest api-models-aws commit"
        type: boolean
        default: true
      xo_version:
        description: "Xo release to use (empty: the newest)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: "true"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      UPDATE_MODELS: ${{ github.event_name != 'workflow_dispatch' || inputs.update_models }}
      XO_VERSION: ${{ inputs.xo_version }}
      # the oldest Xo the models run accepts: an empty xo_version installs the
      # newest release, and a run that gets an older one (a release not yet
      # marked latest) stops here instead of checking with a stale Xo
      XO_MIN_VERSION: "0.48.2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_TIMINGS: ${{ github.workspace }}/.ci/timings.md
      # integration-localstack.sh: Docker is already running on the runner
      DOCKER_UP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xo
        id: xo
        run: |
          bin=$(scripts/ci-step.sh "install xo" scripts/install-xo.sh "$RUNNER_TEMP/xo")
          echo "$bin" >> "$GITHUB_PATH"
          echo "XO_CLI=$bin/xo" >> "$GITHUB_ENV"
          v=$("$bin/xo" version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s\n%s\n' "$XO_MIN_VERSION" "${v#v}" | sort -V | head -1)" != "$XO_MIN_VERSION" ]; then
            echo "::error::Xo $v is older than XO_MIN_VERSION $XO_MIN_VERSION"; exit 1
          fi

      - name: Cache Xo builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/xo
          key: xo-${{ steps.xo.outputs.version }}-${{ hashFiles('**/*.xo', '**/xo.mod', 'xo.work') }}
          restore-keys: |
            xo-${{ steps.xo.outputs.version }}-

      - name: Cache models and protocol tests
        uses: actions/cache@v4
        with:
          path: |
            codegen/.models
            codegen/.protocol-tests
          key: models-${{ hashFiles('codegen/models.lock', 'codegen/protocol-tests.lock') }}
          restore-keys: |
            models-

      - name: Leave out tests this Xo is too old for
        run: scripts/apply-xo-skips.sh

      - name: Fetch models
        run: |
          scripts/ci-step.sh "fetch models" codegen/fetch-models.sh
          scripts/ci-step.sh "fetch protocol tests" codegen/fetch-protocol-tests.sh

      - name: Update models
        timeout-minutes: 30
        id: update
        if: env.UPDATE_MODELS == 'true'
        run: |
          base=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scripts/ci-step.sh "update models" scripts/update-models.sh | tee "$RUNNER_TEMP/update.txt"
          if grep -q '^models: current' "$RUNNER_TEMP/update.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(awk '$1 == "commit" { print $2 }' codegen/models.lock)" >> "$GITHUB_OUTPUT"
          fi
          # staged, so check-all-services counts it as the committed output
          git add -A service xo.work codegen/models.lock

      - name: Gate
        # a hang fails this step instead of the whole job
        timeout-minutes: 60
        run: scripts/ci-step.sh gate scripts/gate.sh

      - name: A native program builds and runs
        timeout-minutes: 20
        if: success() || failure()
        run: scripts/ci-step.sh programs scripts/check-programs.sh

      - name: Every service regenerates unchanged and type checks
        timeout-minutes: 90
        if: success() || failure()
        run: scripts/ci-step.sh "all services" scripts/check-all-services.sh

      - name: Endpoint rules tests
        timeout-minutes: 15
        if: success() || failure()
        run: scripts/ci-step.sh "endpoint tests" scripts/check-endpoints.sh

      - name: LocalStack
        timeout-minutes: 30
        if: success() || failure()
        run: scripts/ci-step.sh localstack scripts/integration-localstack.sh

      - name: Public hygiene
        timeout-minutes: 30
        if: success() || failure()
        run: |
          gl=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$gl" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$gl"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$gl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$gl" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          # check-public runs gitleaks over the history and the working
          # tree (the regenerated files included)
          PATH="$RUNNER_TEMP/gitleaks-bin:$PATH" scripts/ci-step.sh "check public" scripts/check-public.sh

      - name: Merge and tag
        if: success() && env.DRY_RUN != 'true' && steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="models/${{ steps.update.outputs.commit }}"
          git switch -C "$branch"
          git commit -q -m "Models: api-models-aws ${{ steps.update.outputs.commit }}, every check green (run ${{ github.run_id }})"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "Models: api-models-aws ${{ steps.update.outputs.commit }}" --body "Weekly model update. Every check passed in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          gh pr merge "$branch" --squash --delete-branch
          git switch -q main
          git pull -q --ff-only origin main
          scripts/tag-modules.sh "${{ steps.update.outputs.base }}" --push

      - name: Report a red run
        if: failure() && env.DRY_RUN != 'true'
        # never stops before the issue: each step's failure is noted in the
        # issue instead. The branch may already exist (Merge and tag pushed it
        # and then failed, as when Actions may not create pull requests), so
        # it is reused, never force-pushed, and an open pull request is reused.
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          pr="" notes=""
          if [ "${{ steps.update.outputs.changed }}" = true ]; then
            branch="models/${{ steps.update.outputs.commit }}"
            git switch -q -C "$branch" || notes="$notes; git switch $branch failed"
            # what Update models staged (service, xo.work, the lock)
            git add -A service xo.work codegen/models.lock
            if ! git diff --cached --quiet; then
              git commit -q -m "Models: api-models-aws ${{ steps.update.outputs.commit }} (checks failed in run ${{ github.run_id }})" || notes="$notes; commit failed"
            fi
            git push -q origin "$branch" || notes="$notes; push of $branch failed (the remote branch differs; left as it is)"
            pr=$(gh pr list --head "$branch" --state open --json url -q '.[0].url' 2>/dev/null)
            if [ -z "$pr" ]; then
              pr=$(gh pr create --base main --head "$branch" --title "Models: api-models-aws ${{ steps.update.outputs.commit }} (checks failed)" --body "Checks failed: $run" 2>&1) || { notes="$notes; gh pr create: $(echo "$pr" | tail -1)"; pr=""; }
            fi
          fi
          gh issue create --title "Weekly models run failed ($(date -u +%Y-%m-%d))" --body "$(printf 'The weekly models run failed: %s\n\nXo %s.%s%s\n\nTimings:\n\n%s\n' "$run" "${{ steps.xo.outputs.version }}" "${pr:+ Pull request: $pr}" "${branch:+ Branch: $branch.}${notes:+ Report notes:${notes#;}.}" "$(cat "$CI_TIMINGS" 2>/dev/null)")"

      - name: Timings
        if: always()
        run: |
          echo "## Xo ${{ steps.xo.outputs.version }}, models ${{ steps.update.outputs.changed == 'true' && 'updated' || 'unchanged' }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$CI_TIMINGS" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
